name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          IM=convert
          if command -v magick >/dev/null 2>&1; then IM=magick; fi
          ls -la
          SRC=""
          if [ -f icon.png ]; then SRC=icon.png
          elif [ -f icon.jpg ]; then SRC=icon.jpg
          elif [ -f icon.b64 ]; then
            if base64 -d icon.b64 > icon-src.img 2>/dev/null; then SRC=icon-src.img; fi
          fi
          echo "Icon source: ${SRC:-none (using default color icon)}"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            out=app/src/main/res/mipmap-$n/ic_launcher.png
            mkdir -p app/src/main/res/mipmap-$n
            if [ -n "$SRC" ] && $IM "$SRC" -resize ${s}x${s} "$out"; then
              :
            else
              $IM -size ${s}x${s} xc:'#2c2060' "$out"
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DuelLegend-APK
          path: app/build/outputs/apk/debug/app-debug.apk
